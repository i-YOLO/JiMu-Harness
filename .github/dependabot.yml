version: 2

updates:
  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - vendor/**
    schedule:
      interval: monthly
      time: '04:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 30
    open-pull-requests-limit: 3
    groups:
      npm-non-major:
        update-types:
          - minor
          - patch
    labels:
      - kind/dependency
      - area/infra

  - package-ecosystem: uv
    directory: /python/sdk
    schedule:
      interval: monthly
      time: '04:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 30
    open-pull-requests-limit: 3
    groups:
      uv-non-major:
        update-types:
          - minor
          - patch
    labels:
      - kind/dependency
      - area/infra

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '04:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 30
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - kind/dependency
      - area/infra
