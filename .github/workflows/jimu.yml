name: JiMu downstream gates

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: jimu-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the public upstream baseline
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git || true
          git fetch upstream master --tags
      - name: Audit the JiMu downstream diff
        run: node scripts/jimu-audit.mjs --base upstream/master
      - name: Install Gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan the source tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Scan JiMu commits
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="upstream/master..HEAD" --exit-code 1
      - name: Prove new credential fixtures are rejected
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/jimu-gitleaks-negative-control"
          mkdir -p "$fixture"
          printf 'api_key = "%s%s"\n' '9zQp7LmK2vXc8NrT' '4WsY6HdJ1FaB3GeU5CiO0PkR' > "$fixture/credential.txt"
          if gitleaks dir "$fixture" --config .gitleaks.toml --redact --no-banner --exit-code 1; then
            echo "::error::Gitleaks accepted the negative-control credential fixture."
            exit 1
          fi

  upstream-compat:
    name: upstream-compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared libraries
        run: pnpm run build:lib
      - name: Typecheck
        run: pnpm run typecheck:contracts-ready
      - name: Lint
        run: pnpm run lint:contracts-ready
      - name: Verify documentation synchronization
        run: pnpm run doc-sync
      - name: Run core unit tests
        run: pnpm run test

  desktop:
    name: desktop
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared libraries
        run: pnpm run build:lib
      - name: Verify the locked Knowledge template
        run: pnpm --filter @i-yolo/jimu-desktop prepare:knowledge-template:release
      - name: Run JiMu tests
        run: pnpm run jimu:test
      - name: Run native macOS shell cancellation tests
        run: pnpm exec vitest run packages/shell/bash-local/tests/executor.spec.ts
      - name: Build JiMu Desktop
        run: pnpm --filter @i-yolo/jimu-desktop build
      - name: Run JiMu Electron end-to-end tests
        run: pnpm --filter @i-yolo/jimu-desktop test:e2e
      - name: Package macOS Apple Silicon application
        run: pnpm --filter @i-yolo/jimu-desktop pack:mac
      - name: Smoke-test packaged application
        run: pnpm --filter @i-yolo/jimu-desktop test:packaged
      - name: Audit packaged application
        run: node scripts/jimu-release-audit.mjs --root apps/jimu-desktop/release/mac-arm64/JiMu.app/Contents/Resources --platform darwin --arch arm64

  windows-desktop:
    name: windows-desktop
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared libraries
        run: pnpm run build:lib
      - name: Verify the locked Knowledge template
        run: pnpm --filter @i-yolo/jimu-desktop prepare:knowledge-template:release
      - name: Run JiMu tests
        run: pnpm run jimu:test
      - name: Run native Windows shell and ACL tests
        run: >-
          pnpm exec vitest run
          apps/cli/tests/windows-shell.spec.ts
          packages/shell/pwsh-local/tests/executor.spec.ts
          packages/sandbox/sandbox-windows-acl/tests/probe.spec.ts
          packages/shell/pwsh-sandbox/tests/acl.e2e.ts
      - name: Build JiMu Desktop
        run: pnpm --filter @i-yolo/jimu-desktop build
      - name: Run JiMu Electron end-to-end tests
        run: pnpm --filter @i-yolo/jimu-desktop test:e2e
      - name: Build synthetic baseline installer
        run: pnpm --filter @i-yolo/jimu-desktop exec node scripts/build-windows.mjs --version 0.1.99 --output release/baseline
      - name: Build unsigned Windows installer
        run: pnpm --filter @i-yolo/jimu-desktop exec node scripts/build-windows.mjs
      - name: Audit unpacked Windows application
        run: node scripts/jimu-release-audit.mjs --root apps/jimu-desktop/release/win-unpacked/resources --platform win32 --arch x64
      - name: Exercise install, upgrade, ConPTY, and uninstall lifecycle
        run: |
          $version = (Get-Content apps/jimu-desktop/package.json | ConvertFrom-Json).version
          & apps/jimu-desktop/scripts/test-windows-installer.ps1 `
            -BaselineInstaller "apps/jimu-desktop/release/baseline/JiMu-0.1.99-Windows-x64-Setup.exe" `
            -Installer "apps/jimu-desktop/release/JiMu-$version-Windows-x64-Setup.exe" `
            -Version $version `
            -ExpectedSignature NotSigned `
            -InstallRoot "$env:LOCALAPPDATA\JiMu Installer Test\JiMu"
      - name: Generate checksum
        run: |
          $version = (Get-Content apps/jimu-desktop/package.json | ConvertFrom-Json).version
          $installer = "apps/jimu-desktop/release/JiMu-$version-Windows-x64-Setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Out-File -Encoding ascii "$installer.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jimu-windows-x64-pr
          path: |
            apps/jimu-desktop/release/JiMu-*-Windows-x64-Setup.exe
            apps/jimu-desktop/release/JiMu-*-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7
