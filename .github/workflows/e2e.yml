name: E2E (real DeepSeek API)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

concurrency:
  group: real-api-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    name: e2e
    if: github.event_name == 'workflow_dispatch' || vars.JIMU_REAL_API_E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "apparmor userns knob absent; the functional probe decides"
      - name: Preflight (require DEEPSEEK_API_KEY)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY_EXTERNAL is not configured for this repository."
            exit 1
          fi
          echo "DeepSeek E2E credential is configured."
      - name: Build
        run: pnpm run build
      - name: E2E tests (real DeepSeek API)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DSH_E2E_MAX_WORKERS: 14
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
